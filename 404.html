* { box-sizing: border-box; }
body { margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 32px 20px; background: var(--bg); color: var(--text); font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center; }

.links { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 30px; }

a.main { background: #E3242B; border-color: #E3242B; color: #fff; }
@keyframes ping { 0% { box-shadow: 0 0 0 0 rgba(244,122,32,.55); } 80%, 100% { box-shadow: 0 0 0 10px rgba(244,122,32,0); } }
</style>
